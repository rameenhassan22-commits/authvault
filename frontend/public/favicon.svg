<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Matches the purple gradient in your app -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#5b45cc" />
    </linearGradient>
  </defs>

  <!-- Purple rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#brandGradient)" />

  <!-- White "A" centered -->
  <text x="256" y="256" 
        text-anchor="middle" 
        dominant-baseline="central" 
        font-family="'Space Grotesk', 'DM Sans', Arial, sans-serif" 
        font-weight="700" 
        font-size="320" 
        fill="#ffffff" 
        letter-spacing="-10">
    A
  </text>
</svg>
